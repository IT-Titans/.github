# The workflows of this repository pin every action to a commit SHA. A pin that
# nobody moves turns into an outdated action, so Dependabot proposes the moves.
# It updates the SHA together with the version comment on the same line.
#
# Not covered: the ReportGenerator version in dotnet-ci.yml, which is an
# environment variable, and the references in workflow-templates/, which follow
# the release steps described in the README.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # The pull request title must pass the Conventional Commit check.
      prefix: ci
