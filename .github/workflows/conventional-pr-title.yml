# Reusable workflow: fail when the title of a pull request is not a
# Conventional Commit.
#
# Repositories of this organization merge by squash, and the squash commit takes
# the title of the pull request. A title outside the convention therefore becomes
# a commit on the default branch that release tooling cannot classify.
#
# Call it from a workflow that runs on pull_request with the activity types
# opened, edited, reopened and synchronize. "edited" matters: without it,
# correcting the title does not run the check again.
#
# The title reaches the script through an environment variable. It is never
# written into the script text, because a pull request title is text an outsider
# controls.

name: Conventional pull request title

on:
  workflow_call:
    inputs:
      types:
        description: Allowed Conventional Commit types, separated by spaces.
        required: false
        type: string
        default: build chore ci docs feat fix perf refactor revert style test

permissions:
  contents: read

jobs:
  check:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The job reads nothing from the repository. The title comes with the event.
    permissions: {}
    steps:
      - name: Check the pull request title
        shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          ALLOWED_TYPES: ${{ inputs.types }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $title = $env:PR_TITLE
          $allowed = @($env:ALLOWED_TYPES -split '\s+' | Where-Object { $_ })

          if ([string]::IsNullOrWhiteSpace($title)) {
              Write-Host '::error::The event carries no pull request title. Call this workflow from a pull_request event.'
              exit 1
          }

          if ($allowed.Count -eq 0) {
              Write-Host '::error::The list of allowed types is empty.'
              exit 1
          }

          # type, optional (scope), optional "!", a colon, one space, a description.
          # Matched case-sensitively: "Feat: ..." is not a Conventional Commit.
          $pattern = '^(?<type>[a-z]+)(\((?<scope>[^()\s]+)\))?(?<breaking>!)?: (?<description>\S.*)$'

          $problem = $null
          if ($title -cnotmatch $pattern) {
              $problem = 'it does not have the form "type(scope): description"'
          }
          elseif ($allowed -cnotcontains $Matches['type']) {
              $problem = 'its type "{0}" is not one of: {1}' -f $Matches['type'], ($allowed -join ', ')
          }

          if ($problem) {
              Write-Host "::error title=Pull request title::The title is not a Conventional Commit: $problem."
              # The title is printed behind a fixed prefix, never at the start of a
              # line, so that it cannot be read as a workflow command.
              Write-Host "Title: $title"
              Write-Host 'Expected, for example: "fix(parser): handle an empty name". The squash commit takes this title.'
              exit 1
          }

          Write-Host ('The title is a Conventional Commit of type "{0}".' -f $Matches['type'])
