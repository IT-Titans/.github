name: Feature request
description: Propose a change or an addition.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Check the **Status** line in the README first. A repository of the class "frozen" does not take feature requests.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stands in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. Describe the behaviour, not the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including workarounds you use now.
    validations:
      required: false
